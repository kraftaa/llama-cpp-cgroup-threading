name: Linux cgroup reproduction

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Samples per llama-bench workload
        required: true
        default: 5
        type: number

permissions:
  contents: read

concurrency:
  group: linux-cgroup-reproduction
  cancel-in-progress: false

jobs:
  reproduce:
    name: Reproduce on GitHub-hosted Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PR_PARENT_SHA: 10a60cf303566e10d6a7a2774c17d2085503d87b
      PR_SHA: a9672dd07ac5e98768f94fda11b6cb549c2eb744
      MODEL_REVISION: 2ed9be962c95f7625f4963ff51ed472e4538187a
      MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      MODEL_PATH: ${{ github.workspace }}/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      RESULTS_DIR: ${{ github.workspace }}/_gha/results
      REPS: ${{ inputs.repetitions }}

    steps:
      - name: Check out this evidence repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record runner and cgroup environment
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          cgroup_rel=$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)
          process_cgroup="/sys/fs/cgroup${cgroup_rel}"
          {
            uname -a
            lscpu
            docker version
            docker info
            findmnt -t cgroup,cgroup2
            cat /proc/self/cgroup
            echo "resolved process cgroup: $process_cgroup"
            if [[ -f /sys/fs/cgroup/cpu.max ]]; then
              echo "root cpu.max: $(cat /sys/fs/cgroup/cpu.max)"
            else
              echo "root cpu.max: unavailable"
            fi
            if [[ -f "$process_cgroup/cpu.max" ]]; then
              echo "process cpu.max: $(cat "$process_cgroup/cpu.max")"
            else
              echo "process cpu.max: unavailable"
            fi
          } | tee "$RESULTS_DIR/runner-environment.txt"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs

      - name: Download and verify the pinned model
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$MODEL_PATH" \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/${MODEL_REVISION}/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true"
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum --check --strict

      - name: Check out pinned llama.cpp revisions
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin "$PR_PARENT_SHA"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin refs/pull/30267/head
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse FETCH_HEAD)" = "$PR_SHA"
          git -C "$RUNNER_TEMP/llama.cpp" worktree add --detach "$RUNNER_TEMP/pr-parent" "$PR_PARENT_SHA"
          git -C "$RUNNER_TEMP/llama.cpp" worktree add --detach "$RUNNER_TEMP/pr" "$PR_SHA"
          git -C "$RUNNER_TEMP/llama.cpp" worktree add --detach "$RUNNER_TEMP/pr-fractional" "$PR_SHA"
          git -C "$RUNNER_TEMP/pr-fractional" apply --whitespace=nowarn \
            "$GITHUB_WORKSPACE/contribution/0001-common-round-fractional-cgroup-quotas-up.patch"

      - name: Build CPU-only llama-bench images
        run: |
          set -euo pipefail
          docker build --file Dockerfile.build --tag llama-cgroup:pr-parent "$RUNNER_TEMP/pr-parent"
          docker build --file Dockerfile.build --tag llama-cgroup:pr "$RUNNER_TEMP/pr"
          docker build --file Dockerfile.build --tag llama-cgroup:pr-fractional "$RUNNER_TEMP/pr-fractional"

      - name: Run the narrow stop-go matrix
        run: |
          set -euo pipefail
          export FORCE=1
          scripts/run-one.sh llama-cgroup:pr-parent 1 default private all
          scripts/run-one.sh llama-cgroup:pr-parent 1 1 private all
          scripts/run-one.sh llama-cgroup:pr 1 default private all
          scripts/run-one.sh llama-cgroup:pr 1.5 default private all
          scripts/run-one.sh llama-cgroup:pr 1.5 2 private all
          scripts/run-one.sh llama-cgroup:pr-fractional 0.5 default private all
          scripts/run-one.sh llama-cgroup:pr-fractional 1 default private all
          scripts/run-one.sh llama-cgroup:pr-fractional 1.5 default private all
          scripts/run-one.sh llama-cgroup:pr-fractional 2 default private all

      - name: Parse results and apply stop-go criteria
        run: |
          set -euo pipefail
          scripts/parse_results.py
          set +e
          scripts/verify-ci-results.py
          verdict_status=$?
          set -e
          cat "$RESULTS_DIR/ci-verdict.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$verdict_status"

      - name: Upload raw evidence and verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-cgroup-evidence-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30
