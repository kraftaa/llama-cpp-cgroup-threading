<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">llama.cpp throughput at a 1.5 CPU container limit</title>
  <desc id="desc">Grouped bar chart. Prefill throughput rises from 42.91 tokens per second with one thread to 60.50 with two threads, a 41 percent improvement. Decode rises from 31.25 to 38.59 tokens per second, a 23.5 percent improvement.</desc>

  <rect width="1200" height="675" fill="#f8fafc"/>

  <text x="72" y="58" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">llama.cpp at a 1.5-CPU container limit</text>
  <text x="72" y="94" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Two threads used the fractional CPU allowance more effectively</text>

  <rect x="790" y="111" width="18" height="18" rx="2" fill="#94a3b8"/>
  <text x="820" y="126" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">1 thread</text>
  <rect x="930" y="111" width="18" height="18" rx="2" fill="#2563eb"/>
  <text x="960" y="126" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">2 threads</text>

  <line x1="112" y1="540" x2="1120" y2="540" stroke="#64748b" stroke-width="2"/>
  <line x1="112" y1="428.6" x2="1120" y2="428.6" stroke="#dbe2ea" stroke-width="1"/>
  <line x1="112" y1="317.1" x2="1120" y2="317.1" stroke="#dbe2ea" stroke-width="1"/>
  <line x1="112" y1="205.7" x2="1120" y2="205.7" stroke="#dbe2ea" stroke-width="1"/>

  <text x="94" y="546" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">0</text>
  <text x="94" y="434" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">20</text>
  <text x="94" y="323" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">40</text>
  <text x="94" y="212" text-anchor="end" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">60</text>
  <text x="36" y="346" transform="rotate(-90 36 346)" text-anchor="middle" fill="#475569" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Throughput (tokens/second)</text>

  <rect x="210" y="300.9" width="150" height="239.1" rx="4" fill="#94a3b8"/>
  <rect x="385" y="202.9" width="150" height="337.1" rx="4" fill="#2563eb"/>
  <text x="285" y="286" text-anchor="middle" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">42.91</text>
  <text x="460" y="188" text-anchor="middle" fill="#1d4ed8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">60.50</text>
  <text x="372.5" y="168" text-anchor="middle" fill="#166534" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">+41.0%</text>

  <rect x="700" y="365.9" width="150" height="174.1" rx="4" fill="#94a3b8"/>
  <rect x="875" y="325.0" width="150" height="215.0" rx="4" fill="#2563eb"/>
  <text x="775" y="351" text-anchor="middle" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">31.25</text>
  <text x="950" y="310" text-anchor="middle" fill="#1d4ed8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">38.59</text>
  <text x="862.5" y="290" text-anchor="middle" fill="#166534" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">+23.5%</text>

  <text x="372.5" y="578" text-anchor="middle" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Prefill</text>
  <text x="862.5" y="578" text-anchor="middle" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700">Decode</text>

  <line x1="72" y1="610" x2="1128" y2="610" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="640" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Median llama-bench throughput · 2-vCPU Colima Linux VM · Qwen2.5 0.5B Q4_K_M · CPU-only</text>
</svg>
